[package]
name = "shardai-node"
version = "0.1.0"
description = "ShardAi P2P Distributed LLM Desktop Client (Tauri Shell)"
authors = ["ShardAi Team"]
edition = "2021"
license = "MIT"
homepage = "https://shardai.online"
repository = "https://github.com/mikehoai/ShardAi"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
