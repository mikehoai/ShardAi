[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shardai-core-engine"
version = "0.1.0"
description = "ShardAi Local AI Sharding & P2P Engine (FastAPI + PyTorch/llama.cpp)"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.2",
    "huggingface-hub>=0.26.0",
    "typer>=0.12.0",
    "click>=8.1.7",
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "safetensors>=0.4.5",
    "accelerate>=0.34.0",
    "lz4>=4.3.3",
    "zeroconf>=0.132.0",
    "websockets>=12.0",
    "iroh>=1.2.0",
]

[project.scripts]
shardai = "shard_engine.cli:run_cli"

[project.urls]
Homepage = "https://shardai.online"
Website = "https://shardai.online"
Repository = "https://github.com/mikehoai/ShardAi"
Issues = "https://github.com/mikehoai/ShardAi/issues"

[tool.setuptools]
packages = ["shard_engine", "models", "p2p"]
py-modules = ["main"]

[project.optional-dependencies]
gguf = [
    "llama-cpp-python>=0.3.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"
